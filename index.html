<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elektraweb Medical</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app" id="app">

  <header class="topbar">
    <div class="brand">
      <button class="hamburger" id="hamburger" type="button" aria-label="Menüyü aç/kapat" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 6h18M3 12h11M3 18h18M20 9l-3 3 3 3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="logo">ElektraWeb<sup>Medical</sup></span>
    </div>
    <div class="tb-right">
      <span class="tb-btn lang"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" fill="none" stroke="currentColor" stroke-width="2"/></svg>TR</span>
      <span class="tb-btn navy" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18"><rect x="5" y="11" width="14" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2"/></svg></span>
    </div>
  </header>

  <aside class="sidebar" id="sidebar" aria-label="Medical menüsü">
    <ul class="menu">
      <li>
        <button type="button" class="grp-btn" id="medicalBtn" aria-expanded="false" aria-controls="medicalList">
          <svg class="ico" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M10 3h4v7h7v4h-7v7h-4v-7H3v-4h7z" fill="currentColor"/></svg>
          Medical<span class="chev" aria-hidden="true">▴</span>
        </button>
        <ul id="medicalList" hidden>
          <li><button type="button" class="grp-btn sub" id="tanimlarBtn">Tanımlar</button></li>
        </ul>
      </li>
    </ul>
    <div class="side-foot">DEMO · Medical modülü</div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="content" id="content"></main>
</div>

<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var content = document.getElementById('content');
  var medicalBtn = document.getElementById('medicalBtn');
  var medicalList = document.getElementById('medicalList');
  var tanimlarBtn = document.getElementById('tanimlarBtn');

  function show(view) {
    tanimlarBtn.toggleAttribute('aria-current', view === 'tanimlar');
    if (view === 'tanimlar') {
      tanimlarBtn.setAttribute('aria-current', 'page');
      content.innerHTML = '<h1 class="page-title">Tanımlar</h1><div class="empty">Henüz tanım ekranı yok.</div>';
    } else {
      content.innerHTML = '';
    }
  }

  medicalBtn.addEventListener('click', function () {
    var open = medicalBtn.getAttribute('aria-expanded') === 'true';
    medicalBtn.setAttribute('aria-expanded', String(!open));
    medicalList.hidden = open;
  });
  tanimlarBtn.addEventListener('click', function () {
    location.hash = 'tanimlar';
    show('tanimlar');
    app.classList.remove('menu-open');
  });
  document.getElementById('hamburger').addEventListener('click', function () { app.classList.toggle('menu-open'); });
  document.getElementById('scrim').addEventListener('click', function () { app.classList.remove('menu-open'); });

  if (location.hash === '#tanimlar') {
    medicalBtn.setAttribute('aria-expanded', 'true');
    medicalList.hidden = false;
    show('tanimlar');
  }
})();
</script>
</body>
</html>
